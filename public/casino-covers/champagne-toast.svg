    <ellipse cx="0" cy="0" rx="35" ry="9" fill="rgba(255,255,255,0.2)" stroke="#ffffff" stroke-width="2"/>
    <path d="M -27 42 L 27 42 L 8 170 L -8 170 Z" fill="#f2c96d" opacity="0.8"/>
    <ellipse cx="0" cy="42" rx="27" ry="6" fill="#ffe6a3" opacity="0.9"/>
    <g fill="#ffffff">
      <circle cx="-10" cy="120" r="2.4" opacity="0.75"/>
      <circle cx="6" cy="92" r="1.8" opacity="0.6"/>
      <circle cx="-4" cy="62" r="2.2" opacity="0.7"/>
      <circle cx="11" cy="140" r="1.8" opacity="0.6"/>
    </g>
    <rect x="-4" y="170" width="8" height="86" rx="3" fill="rgba(255,255,255,0.16)" stroke="#ffffff" stroke-width="1.5"/>
    <ellipse cx="0" cy="256" rx="30" ry="8" fill="rgba(255,255,255,0.14)" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- right champagne coupe -->
  <g transform="translate(422,410) rotate(-18)">
    <path d="M -35 0 L 35 0 L 8 170 L -8 170 Z" fill="rgba(255,255,255,0.10)" stroke="#ffffff" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="35" ry="9" fill="rgba(255,255,255,0.2)" stroke="#ffffff" stroke-width="2"/>
    <path d="M -27 42 L 27 42 L 8 170 L -8 170 Z" fill="#f2c96d" opacity="0.8"/>
    <ellipse cx="0" cy="42" rx="27" ry="6" fill="#ffe6a3" opacity="0.9"/>
    <g fill="#ffffff">
      <circle cx="10" cy="118" r="2.4" opacity="0.75"/>
      <circle cx="-6" cy="90" r="1.8" opacity="0.6"/>
      <circle cx="4" cy="64" r="2.2" opacity="0.7"/>
      <circle cx="-11" cy="138" r="1.8" opacity="0.6"/>
    </g>
    <rect x="-4" y="170" width="8" height="86" rx="3" fill="rgba(255,255,255,0.16)" stroke="#ffffff" stroke-width="1.5"/>
    <ellipse cx="0" cy="256" rx="30" ry="8" fill="rgba(255,255,255,0.14)" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- clink sparkle -->
  <g stroke="#fff3cf" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="400" y1="390" x2="400" y2="403"/>
    <line x1="400" y1="417" x2="400" y2="430"/>
    <line x1="380" y1="410" x2="393" y2="410"/>
    <line x1="407" y1="410" x2="420" y2="410"/>
    <line x1="386" y1="396" x2="395" y2="405"/>
    <line x1="405" y1="415" x2="414" y2="424"/>
    <line x1="414" y1="396" x2="405" y2="405"/>
    <line x1="395" y1="415" x2="386" y2="424"/>
  </g>
</svg>
