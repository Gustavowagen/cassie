<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="ct-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a0e38"/>
      <stop offset="100%" stop-color="#10030c"/>
    </linearGradient>
    <radialGradient id="ct-glow" cx="50%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#f7c65a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f7c65a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#ct-bg)"/>
  <circle cx="400" cy="420" r="290" fill="url(#ct-glow)"/>

  <g fill="#ffffff">
    <circle cx="110" cy="120" r="2.2" opacity="0.7"/>
    <circle cx="150" cy="190" r="1.6" opacity="0.45"/>
    <circle cx="680" cy="150" r="2.2" opacity="0.65"/>
    <circle cx="650" cy="90" r="1.6" opacity="0.4"/>
    <circle cx="120" cy="640" r="1.8" opacity="0.4"/>
    <circle cx="700" cy="600" r="2" opacity="0.5"/>
  </g>

  <!-- confetti -->
  <g>
    <g transform="translate(240,300) rotate(30)"><rect x="-3" y="-7" width="6" height="14" rx="2" fill="#f7c65a"/></g>
    <g transform="translate(560,280) rotate(-40)"><rect x="-3" y="-7" width="6" height="14" rx="2" fill="#ff8ac2"/></g>
    <g transform="translate(300,210) rotate(15)"><rect x="-3" y="-7" width="6" height="14" rx="2" fill="#fff3cf"/></g>
    <g transform="translate(505,335) rotate(60)"><rect x="-3" y="-7" width="6" height="14" rx="2" fill="#f7c65a"/></g>
    <g transform="translate(330,480) rotate(-20)"><rect x="-3" y="-7" width="6" height="14" rx="2" fill="#ff8ac2"/></g>
    <g transform="translate(475,490) rotate(45)"><rect x="-3" y="-7" width="6" height="14" rx="2" fill="#fff3cf"/></g>
    <g transform="translate(200,430) rotate(10)"><rect x="-3" y="-7" width="6" height="14" rx="2" fill="#f7c65a"/></g>
    <g transform="translate(605,440) rotate(-30)"><rect x="-3" y="-7" width="6" height="14" rx="2" fill="#ff8ac2"/></g>
    <circle cx="270" cy="360" r="4" fill="#f7c65a" opacity="0.8"/>
    <circle cx="540" cy="380" r="4" fill="#fff3cf" opacity="0.8"/>
    <circle cx="420" cy="250" r="3.5" fill="#ff8ac2" opacity="0.75"/>
  </g>

  <!-- left champagne coupe -->
  <g transform="translate(378,410) rotate(18)">
