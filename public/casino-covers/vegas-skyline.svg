<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="vs-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#170833"/>
      <stop offset="55%" stop-color="#2c0e4a"/>
      <stop offset="78%" stop-color="#4a1240"/>
      <stop offset="100%" stop-color="#05020a"/>
    </linearGradient>
    <radialGradient id="vs-horizon" cx="50%" cy="76%" r="55%">
      <stop offset="0%" stop-color="#ff5cb0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff5cb0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vs-beamL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5fe0ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#5fe0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vs-beamR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5cb0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff5cb0" stop-opacity="0"/>
    </linearGradient>
    <filter id="vs-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#vs-sky)"/>
  <ellipse cx="400" cy="760" rx="440" ry="220" fill="url(#vs-horizon)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="90" r="2" opacity="0.7"/>
    <circle cx="150" cy="150" r="1.4" opacity="0.5"/>
    <circle cx="60" cy="220" r="1.6" opacity="0.5"/>
    <circle cx="220" cy="70" r="1.6" opacity="0.6"/>
    <circle cx="650" cy="110" r="2" opacity="0.6"/>
    <circle cx="720" cy="180" r="1.6" opacity="0.5"/>
    <circle cx="590" cy="60" r="1.4" opacity="0.4"/>
    <circle cx="730" cy="70" r="1.8" opacity="0.6"/>
  </g>

  <!-- search beams from pylon base -->
  <polygon points="395,420 120,60 250,60" fill="url(#vs-beamL)"/>
  <polygon points="405,420 680,60 550,60" fill="url(#vs-beamR)"/>

  <!-- far building row -->
  <g fill="#180d2e">
    <rect x="0" y="740" width="80" height="260"/>
    <rect x="85" y="700" width="60" height="300"/>
    <rect x="150" y="760" width="90" height="240"/>
    <rect x="560" y="730" width="70" height="270"/>
    <rect x="635" y="770" width="80" height="230"/>
    <rect x="720" y="700" width="80" height="300"/>
  </g>

  <!-- near building row with windows -->
  <g fill="#0a0518">
    <rect x="30" y="640" width="110" height="360"/>
    <rect x="655" y="610" width="120" height="390"/>
    <rect x="0" y="660" width="35" height="340"/>
  </g>
  <g fill="#ffd88a">
    <rect x="48" y="665" width="8" height="12" opacity="0.85"/>
    <rect x="68" y="665" width="8" height="12" opacity="0.6"/>
    <rect x="88" y="690" width="8" height="12" opacity="0.7"/>
    <rect x="48" y="710" width="8" height="12" opacity="0.5"/>
    <rect x="108" y="710" width="8" height="12" opacity="0.8"/>
    <rect x="680" y="650" width="9" height="13" opacity="0.8"/>
    <rect x="705" y="670" width="9" height="13" opacity="0.55"/>
    <rect x="730" y="650" width="9" height="13" opacity="0.7"/>
    <rect x="680" y="710" width="9" height="13" opacity="0.6"/>
    <rect x="730" y="720" width="9" height="13" opacity="0.75"/>
  </g>

  <!-- neon pylon sign -->
  <g>
    <rect x="358" y="430" width="84" height="340" rx="14" fill="#0a0518" filter="url(#vs-blur)" opacity="0.6"/>
    <rect x="358" y="430" width="84" height="340" rx="14" fill="#150c28" stroke="#5fe0ff" stroke-width="3"/>

    <!-- glow diamond -->
    <path d="M400 452 L432 490 L400 528 L368 490 Z" fill="none" stroke="#ff5cb0" stroke-width="8" filter="url(#vs-blur)" opacity="0.8"/>
    <path d="M400 452 L432 490 L400 528 L368 490 Z" fill="#2c0e4a" stroke="#ff9ed4" stroke-width="3"/>

    <!-- neon rungs -->
    <g stroke="#5fe0ff" stroke-width="6" stroke-linecap="round" filter="url(#vs-blur)" opacity="0.75">
      <line x1="374" y1="570" x2="426" y2="570"/>
      <line x1="374" y1="610" x2="426" y2="610"/>
      <line x1="374" y1="650" x2="426" y2="650"/>
      <line x1="374" y1="690" x2="426" y2="690"/>
    </g>
    <g stroke="#bff3ff" stroke-width="2.5" stroke-linecap="round">
      <line x1="374" y1="570" x2="426" y2="570"/>
      <line x1="374" y1="610" x2="426" y2="610"/>
      <line x1="374" y1="650" x2="426" y2="650"/>
      <line x1="374" y1="690" x2="426" y2="690"/>
    </g>
  </g>
</svg>
